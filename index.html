    // Уникальные темы для автодополнения
    const uniqueTopics = [];
    const seen = new Set();
    KTP.forEach(item => {
        if (!seen.has(item.topic)) {
            seen.add(item.topic);
            const nums = KTP.filter(x => x.topic === item.topic).map(x => x.n);
            uniqueTopics.push({ topic: item.topic, nums, section: item.section, hw: item.hw });
        }
    });

    /* ============================================================
       ЭЛЕМЕНТЫ
       ============================================================ */
    const topicInput = document.getElementById('topic');
    const acList = document.getElementById('acList');
    const sectionBadge = document.getElementById('sectionBadge');
    const gradeInput = document.getElementById('grade');
    const dateInput = document.getElementById('date');
    const teacherInput = document.getElementById('teacher');
    const lessonNumInput = document.getElementById('lessonNum');
    const lessonPlanInput = document.getElementById('lessonPlan');
    const tasksInput = document.getElementById('tasks');
    const homeworkInput = document.getElementById('homework');
    const taskFileInput = document.getElementById('taskFile');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const previewContent = document.getElementById('previewContent');
    const toastEl = document.getElementById('toast');

    let attachedFileData = null;

    function escapeHtml(t) {
        if (!t) return '';
        return String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    }
    function showToast(msg) {
        toastEl.textContent = msg || 'Готово';
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    /* ============================================================
       АВТОДОПОЛНЕНИЕ
       ============================================================ */
    let activeIndex = -1, currentMatches = [];

    function renderMatches(matches) {
        currentMatches = matches;
        activeIndex = -1;
        if (!matches.length) { acList.classList.remove('show'); acList.innerHTML = ''; return; }
        acList.innerHTML = matches.map((m, i) => {
            const n = m.nums.length > 3 ? m.nums.slice(0,3).join(', ')+'…' : m.nums.join(', ');
            return `<div class="autocomplete-item" data-index="${i}">
                <span class="num">№${n}</span>${escapeHtml(m.topic)}
                <span class="sec">${escapeHtml(m.section)}</span>
            </div>`;
        }).join('');
        acList.classList.add('show');
        acList.querySelectorAll('.autocomplete-item').forEach(el => {
            el.addEventListener('click', () => selectTopic(currentMatches[+el.dataset.index]));
        });
    }

    function filterTopics(q) {
        q = q.trim().toLowerCase();
        if (!q) return uniqueTopics.slice(0, 12);
        return uniqueTopics.filter(t => t.topic.toLowerCase().includes(q)).slice(0, 12);
    }

    topicInput.addEventListener('input', function() { renderMatches(filterTopics(this.value)); });
    topicInput.addEventListener('focus', function() { renderMatches(filterTopics(this.value)); });

    topicInput.addEventListener('keydown', function(e) {
        if (!acList.classList.contains('show')) return;
        const items = acList.querySelectorAll('.autocomplete-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); items.forEach((el,i)=>el.classList.toggle('active',i===activeIndex)); if(items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'}); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); items.forEach((el,i)=>el.classList.toggle('active',i===activeIndex)); if(items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'}); }
        else if (e.key === 'Enter') { e.preventDefault(); if (activeIndex>=0 && currentMatches[activeIndex]) selectTopic(currentMatches[activeIndex]); else if (currentMatches.length) selectTopic(currentMatches[0]); }
        else if (e.key === 'Escape') acList.classList.remove('show');
    });

    document.addEventListener('click', e => {
        if (!topicInput.contains(e.target) && !acList.contains(e.target)) acList.classList.remove('show');
    });

    /* ============================================================
       ВЫБОР ТЕМЫ → ГОТОВЫЙ КОНСПЕКТ + ЗАДАНИЯ
       ============================================================ */
    function selectTopic(obj) {
        if (!obj) return;
        topicInput.value = obj.topic;
        acList.classList.remove('show');

        lessonNumInput.value = obj.nums.join(', ');

        sectionBadge.style.display = 'inline-block';
        sectionBadge.textContent = obj.section;

        homeworkInput.value = obj.hw || '—';

        const ready = READY[obj.section] || READY['Повторение'];
        const numsStr = obj.nums.join(', ');

        lessonPlanInput.value = ready.plan(obj.topic, numsStr);
        tasksInput.value = ready.tasks(obj.topic, obj.hw);

        updatePreview();
        showToast('Конспект и задания по теме готовы');
    }

    /* ============================================================
       КНОПКА «ЗАПОЛНИТЬ ИЗ КТП»
       ============================================================ */
    document.getElementById('fillBtn').addEventListener('click', function() {
        const q = topicInput.value.trim().toLowerCase();
        if (!q) { showToast('Введите или выберите тему'); return; }
        const found = uniqueTopics.find(t => t.topic.toLowerCase() === q)
            || uniqueTopics.find(t => t.topic.toLowerCase().includes(q));
        if (found) selectTopic(found);
        else showToast('Тема не найдена в КТП');
    });

    /* ============================================================
       ФАЙЛ
       ============================================================ */
    taskFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) { attachedFileData = null; fileNameDisplay.innerHTML = '<i>файл не выбран</i>'; return; }
        const reader = new FileReader();
        reader.onload = ev => {
            attachedFileData = { name: file.name, type: file.type, dataURL: ev.target.result };
            fileNameDisplay.innerHTML = `<i>📎 ${escapeHtml(file.name)}</i>`;
            showToast('Файл прикреплён');
            updatePreview();
        };
        reader.readAsDataURL(file);
    });

    /* ============================================================
       ПРЕДПРОСМОТР
       ============================================================ */
    function buildLessonHtml() {
        const topic = topicInput.value.trim() || '(тема не выбрана)';
        const grade = gradeInput.value.trim() || '—';
        const date = dateInput.value ? new Date(dateInput.value).toLocaleDateString('ru-RU') : '—';

        const nums = lessonNumInput.value.trim();
        const plan = lessonPlanInput.value.trim() || '—';
        const tasks = tasksInput.value.trim() || '—';
        const hw = homeworkInput.value.trim() || '—';

        let fileHtml = '';
        if (attachedFileData) {
            fileHtml = `<div style="margin-top:12px; background:#eef4fa; border-radius:12px; padding:10px 16px;">📎 <strong>Файл с заданием:</strong> ${escapeHtml(attachedFileData.name)}</div>`;
        }

        return `
        <div style="font-family:'Segoe UI',Roboto,sans-serif; max-width:820px; margin:0 auto;">
            <h1 style="color:#155799; border-bottom:3px solid #cfddee; padding-bottom:12px;">Конспект урока${nums ? ' №'+escapeHtml(nums) : ''}</h1>
            <table style="width:100%; border-collapse:collapse; margin:16px 0; background:#f9fcff; border-radius:16px;">
                <tr><td style="padding:10px 16px; font-weight:600; width:150px;">Тема урока:</td><td style="padding:10px 16px;">${escapeHtml(topic)}</td></tr>
                <tr><td style="padding:10px 16px; font-weight:600;">Класс:</td><td style="padding:10px 16px;">${escapeHtml(grade)}</td></tr>
                <tr><td style="padding:10px 16px; font-weight:600;">Дата:</td><td style="padding:10px 16px;">${escapeHtml(date)}</td></tr>
                <tr><td style="padding:10px 16px; font-weight:600;">Учитель:</td><td style="padding:10px 16px;">${escapeHtml(teacher)}</td></tr>
                ${nums ? `<tr><td style="padding:10px 16px; font-weight:600;">№ урока в КТП:</td><td style="padding:10px 16px;">${escapeHtml(nums)}</td></tr>` : ''}
            </table>

            <h2 style="color:#1e5b9c; margin-top:28px;">📖 Конспект урока</h2>
            <div style="background:#f2f8ff; padding:14px 18px; border-radius:14px; white-space:pre-wrap;">${escapeHtml(plan)}</div>

            <h2 style="color:#1e5b9c;">📝 Задания на уроке</h2>
            <div style="background:#f2f8ff; padding:14px 18px; border-radius:14px; white-space:pre-wrap;">${escapeHtml(tasks)}</div>

            <h2 style="color:#1e5b9c;">🏠 Домашнее задание</h2>
            <p style="background:#f2f8ff; padding:14px 18px; border-radius:14px;">${escapeHtml(hw)}</p>

            ${fileHtml}
            <hr style="margin:28px 0 12px; border:0; border-top:1px solid #d7e5f2;">
            <p style="color:#7b8fa8; font-size:0.85rem;">Конспект сгенерирован в конструкторе урока по базе КТП (5 класс)</p>
        </div>`;
    }

    function updatePreview() { previewContent.innerHTML = buildLessonHtml(); }

    document.getElementById('updatePreviewBtn').addEventListener('click', function() {
        updatePreview(); showToast('Обновлено');
    });

    /* ============================================================
       СКАЧАТЬ HTML
       ============================================================ */
    document.getElementById('saveHtmlBtn').addEventListener('click', function() {
        const topic = topicInput.value.trim() || 'конспект_урока';
        const safe = topic.replace(/[^а-яА-ЯёЁa-zA-Z0-9]/g, '_').substring(0, 40);
        let body = buildLessonHtml();

        if (attachedFileData) {
            const nm = escapeHtml(attachedFileData.name);
            const link = `<div style="margin:18px 0; padding:16px 20px; background:#e9f2fd; border-radius:18px;">
                <strong>📎 Прикреплённый файл:</strong> ${nm}<br>
                <a href="${attachedFileData.dataURL}" download="${nm}" style="display:inline-block; margin-top:10px; background:#1e5b9c; color:white; padding:8px 20px; border-radius:30px; text-decoration:none; font-weight:500;">⬇ Скачать файл</a>
            </div>`;
            const pos = body.lastIndexOf('<hr');
            body = pos !== -1 ? body.slice(0,pos)+link+body.slice(pos) : body+link;
        }

        const full = `<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конспект урока — ${escapeHtml(topic)}</title>
<style>body{font-family:'Segoe UI',Roboto,sans-serif;background:#f4f7fc;margin:0;padding:30px 20px;display:flex;justify-content:center}.lesson-card{max-width:900px;width:100%;background:#fff;border-radius:32px;box-shadow:0 12px 30px rgba(0,20,30,.1);padding:36px 40px}@media print{body{background:#fff}.lesson-card{box-shadow:none;padding:10px}}</style>
</head><body><div class="lesson-card">${body}</div></body></html>`;

        const blob = new Blob([full], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `конспект_${safe}.html`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Файл сохранён');
    });

       ОЧИСТКА
       ============================================================ */
    document.getElementById('clearBtn').addEventListener('click', function() {
        topicInput.value = ''; gradeInput.value = '5'; teacherInput.value = 'Светлакова Вера Андреевна';
        lessonNumInput.value = ''; lessonPlanInput.value = ''; tasksInput.value = ''; homeworkInput.value = '';
