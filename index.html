    </div>

    <div class="grid-2">
        <div class="field">
            <label>Класс</label>
            <input type="text" id="grade" value="5">
        </div>
        <div class="field">
            <label>Дата</label>
            <input type="date" id="date">
        </div>
    </div>

    <div class="grid-2">
        <div class="field">
            <label>Учитель</label>

        </div>
        <div class="field">
            <label>Номер урока (из КТП)</label>
            <input type="text" id="lessonNum" placeholder="например, 1" readonly style="background:#f0f6fe;">
        </div>
    </div>

    <div class="field">
        <label>Цель урока</label>
        <textarea id="goal" rows="2" placeholder="Заполнится автоматически из шаблона"></textarea>
    </div>

    <div class="field">
        <label>Знать / понимать</label>
        <textarea id="know" rows="2" placeholder="Заполнится автоматически из шаблона"></textarea>
    </div>

    <div class="field">
        <label>Уметь</label>
        <textarea id="can" rows="2" placeholder="Заполнится автоматически из шаблона"></textarea>
    </div>

    <div class="field">
        <label>Ход урока</label>
        <textarea id="lessonPlan" rows="6" placeholder="Заполнится шаблоном, можно отредактировать"></textarea>
    </div>

    <div class="field">
        <label>🏠 Домашнее задание (из КТП)</label>
        <textarea id="homework" rows="2" placeholder="Подставится из КТП"></textarea>
    </div>

    <div class="field">
        <label>📝 Задания к уроку (текст)</label>
        <textarea id="tasks" rows="3" placeholder="Здесь можно описать задания. Если прикрепите файл — он появится в конспекте."></textarea>
    </div>

    <div class="file-area">
        <label for="taskFile">📎 Прикрепить файл с заданием
            <input type="file" id="taskFile" accept=".pdf,.doc,.docx,.txt,.jpg,.png,.xls,.xlsx">
        </label>
        <div class="file-name" id="fileNameDisplay"><i>файл не выбран</i></div>
    </div>

    <div class="btn-group">
        <button class="btn" id="clearBtn" type="button">🗑 Очистить</button>
        <button class="btn" id="saveHtmlBtn" type="button">💾 Скачать HTML</button>
        <button class="btn btn-accent" id="fillBtn" type="button">✨ Заполнить из КТП</button>
        <button class="btn btn-primary" id="updatePreviewBtn" type="button">🔄 Обновить предпросмотр</button>
    </div>

    <div class="preview" id="previewBlock">
        <h2>📄 Предпросмотр конспекта</h2>
        <div class="preview-content" id="previewContent"></div>
    </div>
</div>

    function renderMatches(matches) {
        currentMatches = matches;
        activeIndex = -1;
        if (!matches.length) {
            acList.classList.remove('show');
            acList.innerHTML = '';
            return;
        }
        acList.innerHTML = matches.map((m, i) => {
            const lessonsStr = m.lessons.length > 3
                ? m.lessons.slice(0, 3).join(', ') + '…'
                : m.lessons.join(', ');
            return `<div class="autocomplete-item" data-index="${i}">
                <span class="num">№${lessonsStr}</span>${escapeHtml(m.topic)}
                <span class="hw">ДЗ: ${escapeHtml(m.hw || '—')}</span>
            </div>`;
        }).join('');
        acList.classList.add('show');

        acList.querySelectorAll('.autocomplete-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index, 10);
                selectTopic(currentMatches[idx]);
            });
        });
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    function filterTopics(query) {
        const q = query.trim().toLowerCase();
        if (!q) return uniqueTopics.slice(0, 12);
        return uniqueTopics.filter(t => t.topic.toLowerCase().includes(q)).slice(0, 12);
    }

    topicInput.addEventListener('input', function() {
        const q = this.value;
        const matches = filterTopics(q);
        renderMatches(matches);
    });

    topicInput.addEventListener('focus', function() {
        if (this.value.trim() === '') {
            renderMatches(uniqueTopics.slice(0, 12));
        } else {
            renderMatches(filterTopics(this.value));
        }
    });

    topicInput.addEventListener('keydown', function(e) {
        if (!acList.classList.contains('show')) return;
        const items = acList.querySelectorAll('.autocomplete-item');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
            updateActive(items);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
            updateActive(items);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && currentMatches[activeIndex]) {
                selectTopic(currentMatches[activeIndex]);
            } else if (currentMatches.length) {
                selectTopic(currentMatches[0]);
            }
        } else if (e.key === 'Escape') {
            acList.classList.remove('show');
        }
    });

    function updateActive(items) {
        items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
        if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('click', function(e) {
        if (!topicInput.contains(e.target) && !acList.contains(e.target)) {
            acList.classList.remove('show');
        }
    });

    /* ============================================================
       ВЫБОР ТЕМЫ → АВТОЗАПОЛНЕНИЕ
       ============================================================ */
    function selectTopic(topicObj) {
        if (!topicObj) return;
        topicInput.value = topicObj.topic;
        acList.classList.remove('show');

        // Номер урока — первый из списка
        lessonNumInput.value = topicObj.lessons[0] || '';

        // Раздел
        sectionTag.style.display = 'inline-block';
        sectionTag.textContent = topicObj.section;

        // Домашнее задание
        homeworkInput.value = topicObj.hw || '';

        // Задания (дублируем ДЗ, можно редактировать)
        tasksInput.value = topicObj.hw
            ? 'Выполнить: ' + topicObj.hw
            : 'Задания к уроку не указаны в КТП — опишите вручную.';

        // Цель — шаблон по разделу
        goalInput.value = buildGoal(topicObj.topic, topicObj.section);

        // Знать / уметь — шаблоны по разделу
        const kk = buildKnowCan(topicObj.section);
        knowInput.value = kk.know;
        canInput.value = kk.can;

        // Ход урока — шаблон
        lessonPlanInput.value = buildPlan(topicObj.topic, topicObj.section);

        updatePreview();
        showToast('Тема выбрана: ' + topicObj.topic);
    }

    /* ============================================================
       ШАБЛОНЫ ПО РАЗДЕЛАМ
       ============================================================ */
    function buildGoal(topic, section) {
        return `Сформировать представление по теме «${topic}»; отработать практические навыки в рамках раздела «${section}».`;
    }

    function buildKnowCan(section) {
        const map = {
            'Натуральные числа. Действия с натуральными числами': {
                know: 'Понятия натурального числа, разряда, класса; свойства арифметических действий; признаки делимости; порядок действий.',
                can: 'Записывать и сравнивать натуральные числа; выполнять арифметические действия; решать текстовые задачи; применять свойства действий.'
            },
            'Наглядная геометрия. Линии на плоскости': {
                know: 'Понятия точки, прямой, отрезка, луча, ломаной, окружности, угла; единицы измерения длины и углов.',
                can: 'Чертить геометрические фигуры; измерять длины отрезков и углы; строить окружности и углы заданной величины.'
            },
            'Обыкновенные дроби': {
                know: 'Понятие обыкновенной дроби; правильные и неправильные дроби; основное свойство дроби; смешанные числа.',
                can: 'Сравнивать, складывать, вычитать, умножать и делить обыкновенные дроби; решать задачи на дроби.'
            },
            'Наглядная геометрия. Многоугольники': {
                know: 'Понятия многоугольника, прямоугольника, квадрата, треугольника; формулы периметра и площади.',
                can: 'Строить многоугольники; вычислять периметр и площадь; решать практические задачи.'
            },
            'Десятичные дроби': {
                know: 'Понятие десятичной дроби; правила сравнения, сложения, вычитания, умножения и деления десятичных дробей; округление.',
                can: 'Выполнять действия с десятичными дробями; округлять; решать текстовые задачи.'
            },
            'Наглядная геометрия. Тела и фигуры в пространстве': {
                know: 'Понятия многогранника, параллелепипеда, куба; формулу объёма.',
                can: 'Изображать многогранники; строить развёртки; вычислять объём куба и параллелепипеда.'
            },
            'Повторение и обобщение': {
                know: 'Основные понятия и методы курса математики 5 класса.',
                can: 'Применять полученные знания при решении задач, в том числе формата ВПР.'
            }
        };
        return map[section] || {
            know: 'Основные понятия по теме урока.',
            can: 'Применять полученные знания на практике.'
        };
    }

    function buildPlan(topic, section) {
        return `1. Организационный момент (2 мин).
2. Актуализация знаний: устный опрос по предыдущей теме (5 мин).
3. Изучение нового материала по теме «${topic}» (15 мин).
4. Первичное закрепление: работа с учебником и заданиями из КТП (15 мин).
5. Самостоятельная работа / практическая часть (5 мин).
6. Итог урока, рефлексия, запись домашнего задания (3 мин).`;
    }

    /* ============================================================
       ЗАПОЛНИТЬ ИЗ КТП (кнопка)
       ============================================================ */
    document.getElementById('fillBtn').addEventListener('click', function() {
        const q = topicInput.value.trim();
        if (!q) {
            showToast('Сначала введите или выберите тему');
            return;
        }
        const found = uniqueTopics.find(t => t.topic.toLowerCase() === q.toLowerCase())
            || uniqueTopics.find(t => t.topic.toLowerCase().includes(q.toLowerCase()));
        if (found) {
            selectTopic(found);
        } else {
            showToast('Тема не найдена в КТП — заполните вручную');
        }
    });

    /* ============================================================
       ФАЙЛ
       ============================================================ */
    taskFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) {
            attachedFileData = null;
            fileNameDisplay.innerHTML = '<i>файл не выбран</i>';
            return;
        }
        const reader = new FileReader();
        reader.onload = function(ev) {
            attachedFileData = { name: file.name, type: file.type, dataURL: ev.target.result };
            fileNameDisplay.innerHTML = `<i>📎 ${escapeHtml(file.name)}</i>`;
            showToast('Файл прикреплён: ' + file.name);
            updatePreview();
        };
        reader.readAsDataURL(file);
    });

    /* ============================================================
       ПРЕДПРОСМОТР
       ============================================================ */
    function buildLessonHtml() {
        const topic = topicInput.value.trim() || '(тема не указана)';
        const grade = gradeInput.value.trim() || '—';
        const date = dateInput.value ? new Date(dateInput.value).toLocaleDateString('ru-RU') : '—';
        const teacher = teacherInput.value.trim() || '—';
        const lessonNum = lessonNumInput.value.trim();
        const goal = goalInput.value.trim() || '—';
        const know = knowInput.value.trim() || '—';
        const can = canInput.value.trim() || '—';
        const plan = lessonPlanInput.value.trim() || '—';
        const hw = homeworkInput.value.trim() || '—';
        const tasks = tasksInput.value.trim() || '';

        let fileHtml = '';
        if (attachedFileData) {
            const safeName = escapeHtml(attachedFileData.name);
            fileHtml = `<div style="margin-top:12px; background:#eef4fa; border-radius:12px; padding:10px 16px;">📎 <strong>Файл с заданием:</strong> ${safeName}</div>`;
        }

        return `
            <div style="font-family:'Segoe UI',Roboto,sans-serif; max-width:800px; margin:0 auto;">
                <h1 style="color:#155799; border-bottom:3px solid #cfddee; padding-bottom:12px;">Конспект урока${lessonNum ? ' №' + escapeHtml(lessonNum) : ''}</h1>
                <table style="width:100%; border-collapse:collapse; margin:16px 0; background:#f9fcff; border-radius:16px;">
                    <tr><td style="padding:10px 16px; font-weight:600; width:140px;">Тема урока:</td><td style="padding:10px 16px;">${escapeHtml(topic)}</td></tr>
                    <tr><td style="padding:10px 16px; font-weight:600;">Класс:</td><td style="padding:10px 16px;">${escapeHtml(grade)}</td></tr>
                    <tr><td style="padding:10px 16px; font-weight:600;">Дата:</td><td style="padding:10px 16px;">${escapeHtml(date)}</td></tr>
                    <tr><td style="padding:10px 16px; font-weight:600;">Учитель:</td><td style="padding:10px 16px;">${escapeHtml(teacher)}</td></tr>
                    ${lessonNum ? `<tr><td style="padding:10px 16px; font-weight:600;">№ урока в КТП:</td><td style="padding:10px 16px;">${escapeHtml(lessonNum)}</td></tr>` : ''}
                </table>

                <h2 style="color:#1e5b9c; margin-top:28px;">🎯 Цель урока</h2>
                <p style="background:#f2f8ff; padding:14px 18px; border-radius:14px;">${escapeHtml(goal).replace(/\n/g, '<br>')}</p>

                <h2 style="color:#1e5b9c;">📌 Знать / понимать</h2>
                <p style="background:#f2f8ff; padding:14px 18px; border-radius:14px;">${escapeHtml(know).replace(/\n/g, '<br>')}</p>

                <h2 style="color:#1e5b9c;">🛠 Уметь</h2>
                <p style="background:#f2f8ff; padding:14px 18px; border-radius:14px;">${escapeHtml(can).replace(/\n/g, '<br>')}</p>

                <h2 style="color:#1e5b9c;">📖 Ход урока</h2>
                <div style="background:#f2f8ff; padding:14px 18px; border-radius:14px; white-space:pre-wrap;">${escapeHtml(plan)}</div>

                <h2 style="color:#1e5b9c;">📝 Задания к уроку</h2>
                <div style="background:#f2f8ff; padding:14px 18px; border-radius:14px; white-space:pre-wrap;">${escapeHtml(tasks) || '—'}</div>

                <h2 style="color:#1e5b9c;">🏠 Домашнее задание</h2>
                <p style="background:#f2f8ff; padding:14px 18px; border-radius:14px;">${escapeHtml(hw)}</p>

                ${fileHtml}
                <hr style="margin:28px 0 12px; border:0; border-top:1px solid #d7e5f2;">
                <p style="color:#7b8fa8; font-size:0.85rem;">Конспект сгенерирован в конструкторе урока (база КТП 5 класс)</p>
            </div>
        `;
    }

    function updatePreview() {
        previewContent.innerHTML = buildLessonHtml();
    }

    document.getElementById('updatePreviewBtn').addEventListener('click', function() {
        updatePreview();
        showToast('Предпросмотр обновлён');
    });

    /* ============================================================
       СКАЧАТЬ HTML
       ============================================================ */
    document.getElementById('saveHtmlBtn').addEventListener('click', function() {
        const topic = topicInput.value.trim() || 'конспект_урока';
        const safeTopic = topic.replace(/[^а-яА-ЯёЁa-zA-Z0-9]/g, '_').substring(0, 40);
        const fileName = `конспект_${safeTopic}.html`;

        let lessonBody = buildLessonHtml();

        if (attachedFileData) {
            const safeDownloadName = escapeHtml(attachedFileData.name);
            const linkHtml = `<div style="margin:18px 0; padding:16px 20px; background:#e9f2fd; border-radius:18px;">
                <strong>📎 Прикреплённый файл:</strong> ${safeDownloadName}<br>
                <a href="${attachedFileData.dataURL}" download="${safeDownloadName}" style="display:inline-block; margin-top:10px; background:#1e5b9c; color:white; padding:8px 20px; border-radius:30px; text-decoration:none; font-weight:500;">⬇ Скачать файл</a>
            </div>`;
            const insertPos = lessonBody.lastIndexOf('<hr');
            lessonBody = insertPos !== -1
                ? lessonBody.slice(0, insertPos) + linkHtml + lessonBody.slice(insertPos)
                : lessonBody + linkHtml;
        }

        const fullHtml = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конспект урока — ${escapeHtml(topic)}</title>
<style>
body { font-family:'Segoe UI',Roboto,sans-serif; background:#f4f7fc; margin:0; padding:30px 20px; display:flex; justify-content:center; }
.lesson-card { max-width:900px; width:100%; background:white; border-radius:32px; box-shadow:0 12px 30px rgba(0,20,30,0.1); padding:36px 40px; }
@media print { body { background:white; } .lesson-card { box-shadow:none; padding:10px; } }
</style>
</head>
<body><div class="lesson-card">${lessonBody}</div></body>
</html>`;

        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Файл сохранён: ' + fileName);
    });

    /* ============================================================
       ОЧИСТКА
       ============================================================ */
    document.getElementById('clearBtn').addEventListener('click', function() {
        topicInput.value = '';
        gradeInput.value = '5';
        teacherInput.value = 'Светлакова Вера Андреевна';
        lessonNumInput.value = '';
        goalInput.value = '';
        knowInput.value = '';
        canInput.value = '';
        lessonPlanInput.value = '';
        homeworkInput.value = '';
        tasksInput.value = '';
        taskFileInput.value = '';
        attachedFileData = null;
        fileNameDisplay.innerHTML = '<i>файл не выбран</i>';
        sectionTag.style.display = 'none';
        acList.classList.remove('show');
        updatePreview();
        showToast('Поля очищены');
    });

    /* ============================================================
       ИНИЦИАЛИЗАЦИЯ
       ============================================================ */
    if (!dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
    }
    updatePreview();
})();
</script>
</body>
</html>
